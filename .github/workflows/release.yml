name: Release

# Publishing authenticates with API tokens held as repository secrets:
#
#   TEST_PYPI_API_TOKEN   from https://test.pypi.org/manage/account/token/
#   PYPI_API_TOKEN        from https://pypi.org/manage/account/token/
#
# Add them under Settings -> Secrets and variables -> Actions. The tokens are
# never printed and never leave GitHub's secret store.
#
# If a secret is absent the value is empty and the publish action would fall
# back to Trusted Publishing (OIDC), which fails with a confusing error unless
# a publisher is registered on PyPI - so each job checks for its token first
# and stops with a clear message instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        default: testpypi
        options: [testpypi, pypi]
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate metadata
        run: python -m twine check --strict dist/*

      # A release must never ship something that fails its own guarantee.
      - name: Verify the built wheel really works
        run: |
          python -m venv verify-env
          ./verify-env/bin/python -m pip install --quiet dist/*.whl
          ./verify-env/bin/compress --check

          ./verify-env/bin/python - <<'PY'
          import random
          from PIL import Image
          rnd = random.Random(1)
          img = Image.new("RGB", (1200, 900))
          px = img.load()
          for y in range(900):
              for x in range(1200):
                  px[x, y] = (rnd.randint(0, 255), rnd.randint(0, 255), rnd.randint(0, 255))
          img.save("smoke.jpg", quality=97)
          PY

          ./verify-env/bin/compress "smoke.jpg" 0.3
          ./verify-env/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path("smoke_compressed.jpg")
          size = out.stat().st_size
          assert size < 300_000, f"target missed: {size}"
          with Image.open(out) as im:
              im.verify()
          print(f"OK: {size} bytes, strictly under 300,000")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.target == 'testpypi'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check the TestPyPI token is configured
        env:
          TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TEST_PYPI_API_TOKEN is not set. Create a token at" \
                 "https://test.pypi.org/manage/account/token/ and add it at" \
                 "https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          print-hash: true

  pypi:
    name: publish to PyPI
    # On a tag push TestPyPI goes first and must pass; a manual pypi run skips
    # it, and a skipped job must not block this one.
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.testpypi.result == 'success' || needs.testpypi.result == 'skipped')
      && (github.event_name == 'push' || inputs.target == 'pypi')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check the PyPI token is configured
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN is not set. Create a token at" \
                 "https://pypi.org/manage/account/token/ and add it at" \
                 "https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
