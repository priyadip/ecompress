name: Release

# Publishing uses PyPI Trusted Publishing (OIDC): GitHub proves this repo's
# identity to PyPI directly, so no API token is ever stored or pasted anywhere.
#
# If a PYPI_API_TOKEN / TEST_PYPI_API_TOKEN repository secret exists it is used
# instead; when the secret is absent the value is empty and the action falls
# back to Trusted Publishing.
#
# Trusted publisher settings this workflow expects on PyPI and TestPyPI:
#   Owner:          priyadip
#   Repository:     compress-cli
#   Workflow name:  release.yml
#   Environment:    (leave blank)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        default: testpypi
        options: [testpypi, pypi]
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate metadata
        run: python -m twine check --strict dist/*

      # A release must never ship something that fails its own guarantee.
      - name: Verify the built wheel really works
        run: |
          python -m venv verify-env
          ./verify-env/bin/python -m pip install --quiet dist/*.whl
          ./verify-env/bin/compress --check

          ./verify-env/bin/python - <<'PY'
          import random
          from PIL import Image
          rnd = random.Random(1)
          img = Image.new("RGB", (1200, 900))
          px = img.load()
          for y in range(900):
              for x in range(1200):
                  px[x, y] = (rnd.randint(0, 255), rnd.randint(0, 255), rnd.randint(0, 255))
          img.save("smoke.jpg", quality=97)
          PY

          ./verify-env/bin/compress "smoke.jpg" 0.3
          ./verify-env/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path("smoke_compressed.jpg")
          size = out.stat().st_size
          assert size < 300_000, f"target missed: {size}"
          with Image.open(out) as im:
              im.verify()
          print(f"OK: {size} bytes, strictly under 300,000")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.target == 'testpypi'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          print-hash: true

  pypi:
    name: publish to PyPI
    # On a tag push TestPyPI goes first and must pass; a manual pypi run skips
    # it, and a skipped job must not block this one.
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.testpypi.result == 'success' || needs.testpypi.result == 'skipped')
      && (github.event_name == 'push' || inputs.target == 'pypi')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
