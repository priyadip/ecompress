[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ecompress"
version = "2.0.0"
description = "Compress any file below a target size in MB with one simple command."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Priyadip Sau", email = "saupriyadip571@gmail.com" }]
keywords = [
    "compress",
    "compression",
    "target-size",
    "video",
    "image",
    "audio",
    "pdf",
    "ffmpeg",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=9.1",
    "pikepdf>=6",
    # FFmpeg (ffmpeg *and* ffprobe) is required for video and audio. It is
    # pulled in automatically on every platform that has a real binary wheel,
    # so a plain `pip install ecompress` is all a user needs. Platforms
    # without one (Linux aarch64, musl, 32-bit Windows) fall back to a system
    # FFmpeg, and `ecompress --check` says exactly what was found.
    "ffmpeg-binaries>=1.1; sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[project.optional-dependencies]
# Force the bundled FFmpeg even on a platform the marker above skips.
ffmpeg = ["ffmpeg-binaries>=1.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "coverage[toml]>=7.3",
    # Pinned to a minor series: the formatter's output changes between them
    # (0.16 began formatting Python blocks inside Markdown), so an unpinned
    # range lets CI and a developer's machine disagree about `format --check`.
    "ruff>=0.16,<0.17",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
    "pip-audit>=2.7",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/priyadip/compress-cli"
Repository = "https://github.com/priyadip/compress-cli"
Issues = "https://github.com/priyadip/compress-cli/issues"
Changelog = "https://github.com/priyadip/compress-cli/blob/main/CHANGELOG.md"

[project.scripts]
ecompress = "ecompress.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecompress"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "RUF",
    "S",
    "TID",
    "ARG",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ARG002", "S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "pikepdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests that run real encoders and take longer",
    "integration: end-to-end tests that mimic a real user",
]
filterwarnings = ["error", "default::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["ecompress"]
parallel = false

[tool.coverage.paths]
source = ["src/ecompress", "*/site-packages/ecompress"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
